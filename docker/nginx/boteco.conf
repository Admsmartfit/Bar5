# Proxy reverso do Boteco: HTTPS na rede interna, websocket do tempo real separado.

upstream odoo_http {
    server odoo:8069;
}
upstream odoo_ws {
    server odoo:8072;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS (o QR das mesas usa https://boteco.local/...)
server {
    listen 80;
    server_name _;
    # Página de saúde liberada em HTTP para monitoramento simples
    location = /web/health {
        proxy_pass http://odoo_http;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/boteco.crt;
    ssl_certificate_key /etc/nginx/certs/boteco.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 64m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy same-origin;

    # Tempo real (KDS, mapa de mesas, chamados de garçom)
    location /websocket {
        proxy_pass http://odoo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Arquivos estáticos e imagens do cardápio com cache (carregar em < 2 s)
    location ~* /web/(static|image|content)/ {
        proxy_pass http://odoo_http;
        proxy_cache_valid 200 60m;
        expires 24h;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://odoo_http;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/json application/javascript image/svg+xml;
    gzip_min_length 1000;
}

# Modo treinamento (https://boteco.local:8443). O endereço é resolvido na hora do acesso,
# então o nginx sobe normalmente mesmo com o treino desligado.
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/boteco.crt;
    ssl_certificate_key /etc/nginx/certs/boteco.key;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 64m;
    proxy_read_timeout 720s;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host:8443;

    location /websocket {
        set $treino_ws http://odoo-treino:8072;
        proxy_pass $treino_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location / {
        set $treino http://odoo-treino:8069;
        proxy_pass $treino;
        proxy_redirect off;
        error_page 502 503 504 = @desligado;
    }
    location @desligado {
        default_type text/html;
        return 503 '<h1 style="font-family:sans-serif">Modo treinamento desligado</h1><p style="font-family:sans-serif">Ligue com ./scripts/treinamento.sh</p>';
    }
}
